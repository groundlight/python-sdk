# CI/CD workflow for the groundlight-sdk-python repository. We lint, test, deploy docs, and publish
# to pypi.
name: cicd
on:
  workflow_dispatch:
  push:

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.1.3"
jobs:
  # Run our linter on every push to the repository.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # snok/install-poetry is a third-party Action blocked by the GHEC allowlist.
      # Install Poetry from PyPI via pipx instead (package hashes verified by pip).
      - name: install poetry
        run: |
          set -euo pipefail
          # --python pins Poetry to the interpreter selected above; otherwise pipx
          # installs it on the runner default and Poetry builds the venv with that.
          pipx install --python "$(which python)" "poetry==${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: show python version ${{ env.PYTHON_VERSION }}
        run: |
          poetry run python --version
      - name: install linter dependencies
        run: |
          make install-lint
      - name: lint
        run: |
          make lint

  # Check that the checked-in `generated/` tree is what `make generate` produces. This job exists
  # because it is the only place the openapi-generator half of the check reliably runs: it needs
  # node, which contributors don't necessarily have, so locally it skips. Needs no API token.
  test-codegen:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # snok/install-poetry is a third-party Action blocked by the GHEC allowlist.
      # Install Poetry from PyPI via pipx instead (package hashes verified by pip).
      - name: install poetry
        run: |
          set -euo pipefail
          # --python pins Poetry to the interpreter selected above; otherwise pipx
          # installs it on the runner default and Poetry builds the venv with that.
          pipx install --python "$(which python)" "poetry==${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: setup npm
        uses: actions/setup-node@v3
        with:
          # openapi-generator-cli 2.34 pulls in an ESM-only proxy-agent, so it needs node >= 22.
          node-version: 22
          cache: npm
      - name: install the code generator
        run: make install-generator
      - name: check generated/ is what the generator produces
        env:
          # Turns "the generator isn't installed" from a skip into a failure. Locally the check may
          # skip; here it must actually run, or it isn't coverage.
          CODEGEN_CHECK_REQUIRE_GENERATOR: "1"
        run: make test-codegen

  # Run integration tests against the API. For efficiency, we only run one version of python on
  # non-main branches.
  test-simple:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # snok/install-poetry is a third-party Action blocked by the GHEC allowlist.
      # Install Poetry from PyPI via pipx instead (package hashes verified by pip).
      - name: install poetry
        run: |
          set -euo pipefail
          # --python pins Poetry to the interpreter selected above; otherwise pipx
          # installs it on the runner default and Poetry builds the venv with that.
          pipx install --python "$(which python)" "poetry==${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: show python version ${{ env.PYTHON_VERSION }}
        run: |
          poetry run python --version
      - name: install dependencies (without extras)
        run: make install
      # TODO: Should we run all tests against the prod API?
      - name: run tests
        env:
          # This is associated with the "sdk-integ-test" user, credentials on 1password
          GROUNDLIGHT_API_TOKEN: ${{ secrets.GROUNDLIGHT_API_TOKEN }}
        run: make test-integ
      - name: run docs tests
        run: make test-docs
        env:
          # This is associated with the "sdk-test-prod" user, credentials on 1password
          GROUNDLIGHT_API_TOKEN: ${{ secrets.GROUNDLIGHT_API_TOKEN_PROD }}

  # Check that the docs build. (No broken links, etc.)
  test-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Setup npm
        uses: actions/setup-node@v3
        with:
          node-version: 21
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build

  # Checks that the API reference docs built with sphinx build
  test-api-reference-docs:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # snok/install-poetry is a third-party Action blocked by the GHEC allowlist.
      # Install Poetry from PyPI via pipx instead (package hashes verified by pip).
      - name: Install poetry
        run: |
          set -euo pipefail
          # --python pins Poetry to the interpreter selected above; otherwise pipx
          # installs it on the runner default and Poetry builds the venv with that.
          pipx install --python "$(which python)" "poetry==${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Setup npm
        uses: actions/setup-node@v3
        with:
          node-version: 21
          cache: npm
      - name: Install dependencies
        run: make install-sphinx-deps
      - name: Build API documentation
        run: |
          make apidocs

  # Run integration tests against the API (only on the main branch, though). The comprehensive
  # version runs a matrix of python versions for better coverage.
  # This tests runs on
  # - merges to main
  # - releases
  # - branch names ending with "-fulltest"
  test-comprehensive:
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      endsWith(github.ref, '-fulltest')
    needs:
      - test-simple
      - test-docs
    runs-on: ubuntu-latest
    strategy:
      # fail-fast=false works best for flaky tests with manual "retry failed".
      # Of course we should get rid of the race conditions that make these tests flaky.
      # Some AI lied to me and said I could just put "max-retry" here but you can't.
      fail-fast: false
      matrix:
        python-version: [
            #"3.6",   # Default on Ubuntu18.04 but openapi-generator fails
            # "3.7",  # Removed support as of 0.17
            # "3.8",  # Removed support as of 0.19
            "3.9",
            "3.10",
            "3.11",
            "3.12",
            "3.13",
          ]
        install_extras: [true, false]
    steps:
      - name: get code
        uses: actions/checkout@v4
        # Pillow may need these to function
      - name: install potential system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libtiff5-dev libjpeg8-dev libopenjp2-7-dev zlib1g-dev \
          libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev python3-tk \
          libharfbuzz-dev libfribidi-dev libxcb1-dev
      - name: install modern python for poetry
        uses: actions/setup-python@v4
        with:
          # We use this python to install poetry -- we choose a modern version
          python-version: ${{ env.PYTHON_VERSION }}
      # snok/install-poetry is a third-party Action blocked by the GHEC allowlist.
      # Install Poetry from PyPI via pipx instead (package hashes verified by pip).
      - name: install poetry
        run: |
          set -euo pipefail
          # --python pins Poetry to the interpreter selected above; otherwise pipx
          # installs it on the runner default and Poetry builds the venv with that.
          pipx install --python "$(which python)" "poetry==${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install python for python-sdk venv
        uses: actions/setup-python@v4
        with:
          # We use this python for the sdk venv
          python-version: ${{ matrix.python-version }}
      - name: choose python version ${{ matrix.python-version }}
        run: |
          # set the environment to use the matrix python version
          poetry env use python${{ matrix.python-version }}
          poetry run python --version
      - name: show python version ${{ matrix.python-version }}
        run: |
          poetry run python --version
      - name: install dependencies
        run: make install
      - name: install extras
        if: matrix.install_extras
        run: make install-extras
      # TODO: Should we run all tests against the prod API?
      - name: run tests
        env:
          # This is associated with the "sdk-integ-test" user, credentials on 1password
          GROUNDLIGHT_API_TOKEN: ${{ secrets.GROUNDLIGHT_API_TOKEN }}
        run: make test-integ
      - name: run docs tests
        run: make test-docs
        env:
          # This is associated with the "sdk-test-prod" user, credentials on 1password
          GROUNDLIGHT_API_TOKEN: ${{ secrets.GROUNDLIGHT_API_TOKEN_PROD }}

  # Run the auto-formatter when we're not on the main branch or creating a release. This will push a
  # new commit to the PR branch if needed.
  format:
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # snok/install-poetry is a third-party Action blocked by the GHEC allowlist.
      # Install Poetry from PyPI via pipx instead (package hashes verified by pip).
      - name: install poetry
        run: |
          set -euo pipefail
          # --python pins Poetry to the interpreter selected above; otherwise pipx
          # installs it on the runner default and Poetry builds the venv with that.
          pipx install --python "$(which python)" "poetry==${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: show python version ${{ env.PYTHON_VERSION }}
        run: |
          poetry run python --version
      - name: install linter dependencies
        run: |
          make install-lint
      - name: run formatter
        run: |
          make format
      - name: check for modified files
        id: git-check
        run: |
          git status
          echo ::set-output name=modified::$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)
      - name: push changes (if needed)
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'Auto-format Bot'
          git config --global user.email 'autoformatbot@groundlight.ai'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git commit -am "Automatically reformatting code"
          git push

  # Build docs in GHEC CI, then publish to public groundlight/python-sdk gh-pages
  # (https://code.groundlight.ai/python-sdk/). Same Mirror App auth as mirror-to-public.
  # TODO: We'd like to build on pushes on any branch when docs/** changes. But then only deploy if
  # we are on the `main` branch and docs/** has changes.
  deploy-docs:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - test-comprehensive
      - test-api-reference-docs
    runs-on: ubuntu-latest
    # Writes use the App token; GITHUB_TOKEN only needs checkout/read.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/
    steps:
      - name: Generate GitHub App token
        id: app-token
        # Pin to commit SHA so the mutable v1 tag cannot be silently retargeted.
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: groundlight
          repositories: python-sdk

      - name: Get code
        uses: actions/checkout@v4
        with:
          # Avoid GITHUB_TOKEN http.extraheader overriding the App token when
          # pushing to the public repo's gh-pages.
          persist-credentials: false

      # Pillow may need these to function
      - name: install potential system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libtiff5-dev libjpeg8-dev libopenjp2-7-dev zlib1g-dev \
          libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev python3-tk \
          libharfbuzz-dev libfribidi-dev libxcb1-dev
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # snok/install-poetry is a third-party Action blocked by the GHEC allowlist.
      # Install Poetry from PyPI via pipx instead (package hashes verified by pip).
      - name: Install poetry
        run: |
          set -euo pipefail
          # --python pins Poetry to the interpreter selected above; otherwise pipx
          # installs it on the runner default and Poetry builds the venv with that.
          pipx install --python "$(which python)" "poetry==${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Setup npm
        uses: actions/setup-node@v3
        with:
          node-version: 21
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install sphinx dependencies
        run: |
          cd ..
          make install-sphinx-deps
      - name: Build website
        run: |
          cd ..
          make docs-comprehensive

      # Customer-facing Pages stay on public groundlight/python-sdk (no DNS change).
      - name: Deploy website to public gh-pages
        working-directory: ${{ github.workspace }}
        env:
          MIRROR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${MIRROR_TOKEN}"
          PUBLISH_DIR=docs/build
          test -d "$PUBLISH_DIR"

          # github-actions[bot] noreply address (user id 41898282).
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add public \
            "https://github.com/groundlight/python-sdk.git"
          git config --local credential.helper \
            "!f() { echo username=x-access-token; echo password=\${MIRROR_TOKEN}; }; f"

          git fetch public gh-pages:refs/remotes/public/gh-pages --no-tags
          git worktree add gh-pages-deploy public/gh-pages

          # Replace published content; keep branch history via a new commit.
          find gh-pages-deploy -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$PUBLISH_DIR"/. gh-pages-deploy/
          touch gh-pages-deploy/.nojekyll

          cd gh-pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Deploy docs $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push public HEAD:refs/heads/gh-pages

  # When a release is created on github (and comprehensive tests passed), publish the groundlight
  # package to public pypi.
  publish-python-package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - test-comprehensive
      - lint
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: install potential system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libtiff5-dev libjpeg8-dev libopenjp2-7-dev zlib1g-dev \
          libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev python3-tk \
          libharfbuzz-dev libfribidi-dev libxcb1-dev
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # snok/install-poetry is a third-party Action blocked by the GHEC allowlist.
      # Install Poetry from PyPI via pipx instead (package hashes verified by pip).
      - name: install poetry
        run: |
          set -euo pipefail
          # --python pins Poetry to the interpreter selected above; otherwise pipx
          # installs it on the runner default and Poetry builds the venv with that.
          pipx install --python "$(which python)" "poetry==${{ env.POETRY_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: show python version ${{ env.PYTHON_VERSION }}
        run: |
          poetry run python --version
      - name: build package
        run: poetry build
      - name: configure poetry and publish
        env:
          # Only expose the PyPI token to the publish step (not the whole job).
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_PUBLISH_TOKEN }}
        run: poetry publish
